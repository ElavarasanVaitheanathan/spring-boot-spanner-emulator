# Spring Boot Application Configuration
spring.application.name=spring-boot-spanner-app
server.port=8080

# Cloud Spanner Configuration
spring.cloud.gcp.project-id=${SPRING_CLOUD_GCP_PROJECT_ID:test-project}
spring.cloud.gcp.spanner.instance-id=${SPRING_CLOUD_GCP_SPANNER_INSTANCE_ID:test-instance}
spring.cloud.gcp.spanner.database=${SPRING_CLOUD_GCP_SPANNER_DATABASE:test-database}
spring.cloud.gcp.spanner.emulator-host=${SPANNER_EMULATOR_HOST:localhost:9010}

# Logging
logging.level.root=INFO
logging.level.com.google.cloud=DEBUG
logging.level.com.example=DEBUG
