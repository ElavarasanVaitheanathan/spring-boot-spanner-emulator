version: '3.8'

services:
  # Google Cloud Spanner Emulator
  spanner-emulator:
    image: gcr.io/cloud-spanner-emulator/emulator:latest
    container_name: spanner-emulator
    ports:
      - "9010:9010"  # gRPC port
      - "9020:9020"  # REST port
    environment:
      - SPANNER_GRPC_PORT=9010
      - SPANNER_HTTP_PORT=9020
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9020/v1/projects/test-project/instances"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spanner-network

  # Schema initialization container
  spanner-init:
    image: google/cloud-sdk:latest
    container_name: spanner-init
    depends_on:
      spanner-emulator:
        condition: service_healthy
    environment:
      - SPANNER_EMULATOR_HOST=spanner-emulator:9010
      - GCLOUD_PROJECT=test-project
    volumes:
      - ./init-scripts:/scripts
    entrypoint: /bin/bash
    command: /scripts/init-spanner.sh
    networks:
      - spanner-network

  # Spring Boot Application
  spring-boot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-boot-app
    depends_on:
      spanner-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - SPANNER_EMULATOR_HOST=spanner-emulator:9010
      - SPRING_CLOUD_GCP_SPANNER_INSTANCE_ID=test-instance
      - SPRING_CLOUD_GCP_SPANNER_DATABASE=test-database
      - SPRING_CLOUD_GCP_PROJECT_ID=test-project
      - SPRING_PROFILES_ACTIVE=default
    networks:
      - spanner-network
    restart: on-failure

networks:
  spanner-network:
    driver: bridge
